services:
  admin-client:
    build:
      context: ./client
    restart: unless-stopped
    labels:
      nucleus.managed: "true"
      nucleus.stack: "nucleus"
      nucleus.role: "app-client"
      nucleus.app: "admin"
    environment:
      # Host edits over the Docker VM file share (virtiofs) emit no inotify
      # events, so Vite would keep serving stale modules — poll instead.
      CHOKIDAR_USEPOLLING: "true"
      # Vite dev server's allowedHosts reads this (see client/vite.config.js).
      NUCLEUS_HOST: ${NUCLEUS_HOST:-nucleus.olm-altair.ts.net}
    volumes:
      - ./client/src:/app/src
      - ./client/index.html:/app/index.html
      - ./client/vite.config.js:/app/vite.config.js
      - ../../core:/app/core:ro
      - ../../plugins:/app/plugins:ro
      # Widget package, so core/AuthGuard's @widgets-core import resolves (Pulse
      # widgets can float in this app). Mirrors the hub. Read-only.
      - ../../widgets:/app/widgets:ro
